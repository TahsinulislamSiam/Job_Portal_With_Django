{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}JobPortal{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        /* Navbar */

        .navbar {
            background: #111827;
            color: white;
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #60a5fa;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: #e5e7eb;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .btn-nav {
            background: #2563eb;
            padding: 9px 16px;
            border-radius: 7px;
            color: white !important;
        }

        .btn-nav:hover {
            background: #1d4ed8;
        }

        /* Main */

        .container {
            width: 88%;
            max-width: 1200px;
            margin: 40px auto;
        }

        /* Hero */

        .hero {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            padding: 70px 40px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .hero-btn {
            display: inline-block;
            background: white;
            color: #1d4ed8;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Page Header */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 30px;
        }

        /* Job Grid */

        .job-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .job-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            border: 1px solid #e5e7eb;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .job-card h2 {
            font-size: 21px;
            margin-bottom: 8px;
            color: #111827;
        }

        .company {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .job-info {
            margin: 8px 0;
            color: #6b7280;
        }

        .job-description {
            color: #6b7280;
            margin: 15px 0;
        }

        /* Buttons */

        .btn {
            display: inline-block;
            padding: 10px 17px;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-right: 6px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        /* Detail */

        .detail-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .detail-title {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .detail-company {
            color: #2563eb;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .detail-section {
            margin-top: 30px;
        }

        .detail-section h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }

        .meta-box {
            background: #f3f4f6;
            padding: 12px 18px;
            border-radius: 8px;
        }

        /* Forms */

        .form-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .form-container h1 {
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* Tables */

        .table-container {
            background: white;
            border-radius: 15px;
            overflow-x: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 17px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            color: #374151;
        }

        tr:hover {
            background: #f9fafb;
        }

        /* Empty */

        .empty {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 15px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #6b7280;
            margin-bottom: 20px;
        }

        /* Alert */

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #dbeafe;
            color: #1e40af;
        }

        /* Footer */

        footer {
            margin-top: 70px;
            background: #111827;
            color: #9ca3af;
            text-align: center;
            padding: 30px;
        }

        footer strong {
            color: #60a5fa;
        }

        /* Responsive */

        @media (max-width: 900px) {
            .job-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav-links {
                gap: 12px;
            }
        }

        @media (max-width: 650px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .job-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 30px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <a href="{% url 'job_list' %}" class="logo">
            JobPortal
        </a>

        <div class="nav-links">

            <a href="{% url 'job_list' %}">
                Home
            </a>

           {% if user.is_authenticated %}

    <a href="{% url 'my_jobs' %}">
        My Jobs
    </a>

    <a href="{% url 'my_applications' %}">
        My Applications
    </a>

    <a href="{% url 'job_create' %}" class="btn-nav">
        + Post Job
    </a>

    <form
        method="POST"
        action="{% url 'logout' %}"
        style="display:inline;"
    >

        {% csrf_token %}

        <button
            type="submit"
            class="btn btn-secondary"
        >
            Logout
        </button>

    </form>

{% else %}

    <a href="{% url 'login' %}">
        Login
    </a>

    <a href="{% url 'register' %}" class="btn-nav">
        Register
    </a>

{% endif %}

        </div>

    </nav>


    <!-- Main -->

    <main class="container">

        {% block content %}

        {% endblock %}

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 <strong>JobPortal</strong>.
            All rights reserved.
        </p>

    </footer>

</body>

</html>
